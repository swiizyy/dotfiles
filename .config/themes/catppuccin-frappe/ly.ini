# Catppuccin Frappé Theme for ly display manager
# Configuration file for ly TUI display manager
# Documentation: https://github.com/fairyglade/ly

# Animation settings
animate = true
animation_timeout_ms = 5000

# Visual settings
hide_borders = false
hide_f1_commands = false

# Clock settings
clock = %c

# Language settings
lang = 

# TTY settings
tty = 2

# Console settings
console_dev = /dev/console

# Theme settings
enable_colors = true

# Catppuccin Frappé Color scheme settings
default_color = #303446:#c6d0f5
box_color = #292c3c:#c6d0f5
input_color = #292c3c:#c6d0f5
selection_color = #8caaee:#303446
error_color = #e78284:#303446
success_color = #8caaee:#303446
session_color = #8caaee:#303446

# Security settings
clear_password = true
max_tries = 3
timeout = 300

# Session directories
wayland_sessions_dir = /usr/share/wayland-sessions
x11_sessions_dir = /usr/share/xsessions
