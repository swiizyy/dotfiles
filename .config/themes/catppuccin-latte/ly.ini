# Catppuccin Latte Theme for ly display manager
# Configuration file for ly TUI display manager
# Documentation: https://github.com/fairyglade/ly

# Animation settings
animate = true
animation_timeout_ms = 5000

# Visual settings
hide_borders = false
hide_f1_commands = false

# Clock settings
clock = %c

# Language settings
lang = 

# TTY settings
tty = 2

# Console settings
console_dev = /dev/console

# Theme settings
enable_colors = true

# Catppuccin Latte Color scheme settings
default_color = #eff1f5:#4c4f69
box_color = #e6e9ef:#4c4f69
input_color = #e6e9ef:#4c4f69
selection_color = #1e66f5:#eff1f5
error_color = #e64553:#eff1f5
success_color = #1e66f5:#eff1f5
session_color = #1e66f5:#eff1f5

# Security settings
clear_password = true
max_tries = 3
timeout = 300

# Session directories
wayland_sessions_dir = /usr/share/wayland-sessions
x11_sessions_dir = /usr/share/xsessions
