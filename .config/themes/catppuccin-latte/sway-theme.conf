# Catppuccin Latte Theme for Sway Configuration
# Catppuccin Latte Color Variables
set $base #eff1f5
set $surface #e6e9ef
set $text #4c4f69
set $accent #1e66f5
set $urgent #e64553
set $muted #7c7f93

# Window decoration colors
client.focused          $accent   $accent   $text   $urgent     $accent
client.focused_inactive $muted    $base     $text   $urgent     $muted
client.unfocused        $muted    $base     $muted  $urgent     $muted
client.urgent           $urgent   $urgent   $text   $urgent     $urgent
client.placeholder      $muted    $base     $muted  $urgent     $muted

# Sway bar colors
bar {
    position top
    status_command while date +'%Y-%m-%d %I:%M:%S %p'; do sleep 1; done
    
    colors {
        statusline $text
        background $base
        inactive_workspace $base $base $muted
        active_workspace $base $base $text
        focused_workspace $accent $accent $text
        urgent_workspace $urgent $urgent $text
        binding_mode $urgent $urgent $text
    }
}

# Window borders
default_border pixel 2
default_floating_border pixel 2
gaps inner 10
gaps outer 5

# Focus follows mouse
focus_follows_mouse yes

# Floating window rules
for_window [app_id="^.*"] border pixel 2
for_window [class="^.*"] border pixel 2
