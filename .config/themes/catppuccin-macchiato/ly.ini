# Catppuccin Macchiato Theme for ly display manager
# Configuration file for ly TUI display manager
# Documentation: https://github.com/fairyglade/ly

# Animation settings
animate = true
animation_timeout_ms = 5000

# Visual settings
hide_borders = false
hide_f1_commands = false

# Clock settings
clock = %c

# Language settings
lang = 

# TTY settings
tty = 2

# Console settings
console_dev = /dev/console

# Theme settings
enable_colors = true

# Catppuccin Macchiato Color scheme settings
default_color = #24273a:#cad3f5
box_color = #1e2030:#cad3f5
input_color = #1e2030:#cad3f5
selection_color = #8aadf4:#24273a
error_color = #ed8796:#24273a
success_color = #8aadf4:#24273a
session_color = #8aadf4:#24273a

# Security settings
clear_password = true
max_tries = 3
timeout = 300

# Session directories
wayland_sessions_dir = /usr/share/wayland-sessions
x11_sessions_dir = /usr/share/xsessions
