# Catppuccin Mocha Theme for Sway Configuration
# Catppuccin Mocha Color Variables
set $base #1e1e2e
set $mantle #181825
set $crust #11111b
set $surface0 #313244
set $surface1 #45475a
set $surface2 #585b70
set $overlay0 #6c7086
set $overlay1 #7f849c
set $overlay2 #9399b2
set $subtext0 #a6adc8
set $subtext1 #bac2de
set $text #cdd6f4
set $lavender #b4befe
set $blue #89b4fa
set $sapphire #74c7ec
set $sky #89dceb
set $teal #94e2d5
set $green #a6e3a1
set $yellow #f9e2af
set $peach #fab387
set $maroon #eba0ac
set $red #f38ba8
set $mauve #cba6f7
set $pink #f5c2e7
set $flamingo #f2cdcd
set $rosewater #f5e0dc

# Window decoration colors
# class                 border  backgr. text    indicator child_border
client.focused          $blue   $blue   $text   $pink     $blue
client.focused_inactive $surface1 $base $text   $pink     $surface1
client.unfocused        $surface1 $base $overlay2 $pink   $surface1
client.urgent           $red    $red    $text   $pink     $red
client.placeholder      $surface1 $base $overlay2 $pink   $surface1

# Sway bar colors
bar {
    position top
    status_command while date +'%Y-%m-%d %I:%M:%S %p'; do sleep 1; done
    
    colors {
        statusline $text
        background $base
        inactive_workspace $base $base $surface1
        active_workspace $base $base $text
        focused_workspace $blue $blue $text
        urgent_workspace $red $red $text
        binding_mode $red $red $text
    }
}

# Window borders
default_border pixel 2
default_floating_border pixel 2
gaps inner 10
gaps outer 5

# Focus follows mouse
focus_follows_mouse yes

# Floating window rules
for_window [app_id="^.*"] border pixel 2
for_window [class="^.*"] border pixel 2