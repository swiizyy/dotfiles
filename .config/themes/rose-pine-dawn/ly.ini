# Rose Pine Dawn Theme for ly display manager
# Configuration file for ly TUI display manager
# Documentation: https://github.com/fairyglade/ly

# Animation settings
animate = true
animation_timeout_ms = 5000

# Visual settings
# Hide borders around login elements
hide_borders = false

# Hide the function key (F1, F2, etc.) hints
hide_f1_commands = false

# Clock settings
clock = %c

# Language settings
# Leave empty for system default
lang = 

# TTY settings
tty = 2

# Console settings
console_dev = /dev/console

# Theme settings
# Set to true to enable colors
enable_colors = true

# Rose Pine Dawn Color scheme settings
# These use standard terminal color codes
# Format: bg_color:fg_color
# Colors: 0-15 (standard terminal colors)
# Or use RGB: #RRGGBB format

# Main background/foreground (base:text)
default_color = #faf4ed:#575279

# Box colors (login dialog) (surface:text)
box_color = #fffaf3:#575279

# Input field colors (overlay:text)
input_color = #f2e9e1:#575279

# Selection colors (pine:base)
selection_color = #286983:#faf4ed

# Error message colors (love:base)
error_color = #b4637a:#faf4ed

# Success message colors (foam:base)
success_color = #56949f:#faf4ed

# Session selection colors (iris:base)
session_color = #907aa9:#faf4ed

# Available sessions
# ly will automatically detect available sessions
# You can also manually specify them here
# sessions = sway,i3,dwm,awesome

# Custom session commands
# Format: session_name:command
# session_cmd = mysession:/path/to/my/session

# Security settings
# Clear password after unsuccessful login
clear_password = true

# Maximum login attempts (0 = unlimited)
max_tries = 3

# Timeout for inactivity (seconds, 0 = disabled)
timeout = 300

# Wayland session directory
wayland_sessions_dir = /usr/share/wayland-sessions

# X11 session directory
x11_sessions_dir = /usr/share/xsessions

# Environment variables to set
# env = XDG_SESSION_TYPE=wayland
# env = XDG_CURRENT_DESKTOP=sway