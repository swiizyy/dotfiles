# Rose Pine Dawn Theme for Sway Configuration
# Rose Pine Dawn Color Variables
set $base #faf4ed
set $surface #fffaf3
set $overlay #f2e9e1
set $muted #9893a5
set $subtle #797593
set $text #575279
set $love #b4637a
set $gold #ea9d34
set $rose #d7827e
set $pine #286983
set $foam #56949f
set $iris #907aa9

# Window decoration colors
# class                 border  backgr. text    indicator child_border
client.focused          $pine   $pine   $base   $rose     $pine
client.focused_inactive $subtle $base   $text   $rose     $subtle
client.unfocused        $subtle $base   $muted  $rose     $subtle
client.urgent           $love   $love   $base   $rose     $love
client.placeholder      $subtle $base   $muted  $rose     $subtle

# Sway bar colors
bar {
    position top
    status_command while date +'%Y-%m-%d %I:%M:%S %p'; do sleep 1; done
    
    colors {
        statusline $text
        background $base
        inactive_workspace $base $base $subtle
        active_workspace $base $base $text
        focused_workspace $pine $pine $base
        urgent_workspace $love $love $base
        binding_mode $love $love $base
    }
}

# Window borders
default_border pixel 2
default_floating_border pixel 2
gaps inner 10
gaps outer 5

# Focus follows mouse
focus_follows_mouse yes

# Floating window rules
for_window [app_id="^.*"] border pixel 2
for_window [class="^.*"] border pixel 2