# Rose Pine Moon Theme for Sway Configuration
# Rose Pine Moon Color Variables
set $base #232136
set $surface #2a273f
set $overlay #393552
set $muted #6e6a86
set $subtle #908caa
set $text #e0def4
set $love #eb6f92
set $gold #f6c177
set $rose #ebbcba
set $pine #3e8fb0
set $foam #9ccfd8
set $iris #c4a7e7

# Window decoration colors
# class                 border  backgr. text    indicator child_border
client.focused          $pine   $pine   $text   $rose     $pine
client.focused_inactive $subtle $base   $text   $rose     $subtle
client.unfocused        $subtle $base   $muted  $rose     $subtle
client.urgent           $love   $love   $text   $rose     $love
client.placeholder      $subtle $base   $muted  $rose     $subtle

# Sway bar colors
bar {
    position top
    status_command while date +'%Y-%m-%d %I:%M:%S %p'; do sleep 1; done
    
    colors {
        statusline $text
        background $base
        inactive_workspace $base $base $subtle
        active_workspace $base $base $text
        focused_workspace $pine $pine $text
        urgent_workspace $love $love $text
        binding_mode $love $love $text
    }
}

# Window borders
default_border pixel 2
default_floating_border pixel 2
gaps inner 10
gaps outer 5

# Focus follows mouse
focus_follows_mouse yes

# Floating window rules
for_window [app_id="^.*"] border pixel 2
for_window [class="^.*"] border pixel 2